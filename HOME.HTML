<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loki | Enter the Legend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #f3e5c8; --gold: #d2a24c; --deep: #07100e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { color: var(--paper); font-family: "DM Sans", sans-serif; background: var(--deep); }
    .landing {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(90deg, rgba(4, 11, 9, .94), rgba(9, 30, 23, .48), rgba(4, 10, 8, .8)),
        linear-gradient(0deg, rgba(4, 10, 8, .92), transparent 55%),
        url("./loki-home.jpg") center / cover;
    }
    .landing::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(115deg, transparent 35%, rgba(204, 160, 75, .14) 35.1%, transparent 35.4%), linear-gradient(65deg, transparent 60%, rgba(204, 160, 75, .1) 60.1%, transparent 60.4%); opacity: .75; }
    .nav { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 30px clamp(24px, 6vw, 90px); }
    .mark { color: var(--gold); font-family: "Cinzel", serif; font-size: 13px; font-weight: 700; letter-spacing: .3em; }
    .nav-note { color: rgba(243, 229, 200, .65); font-size: 10px; letter-spacing: .25em; text-transform: uppercase; }
    .content { width: min(850px, 88vw); text-align: center; }
    .eyebrow { color: var(--gold); font-size: 11px; letter-spacing: .42em; text-transform: uppercase; }
    h1 { margin: 26px 0 20px; font-family: "Cinzel", serif; font-size: clamp(48px, 8vw, 108px); font-weight: 600; line-height: .98; letter-spacing: .03em; }
    h1 span { display: block; color: var(--gold); font-size: .68em; font-style: italic; }
    .intro { max-width: 490px; margin: 0 auto; color: rgba(243, 229, 200, .72); font-size: 15px; line-height: 1.8; }
    .enter { display: inline-flex; align-items: center; gap: 14px; margin-top: 42px; padding: 14px 20px; border: 0; border-bottom: 1px solid var(--gold); background: transparent; color: var(--paper); cursor: pointer; font-family: "DM Sans", sans-serif; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; text-decoration: none; transition: color .3s ease, gap .3s ease, border-color .3s ease; }
    .enter::after { content: "↗"; color: var(--gold); font-size: 17px; }
    .enter:hover { gap: 21px; color: var(--gold); border-color: var(--paper); }
    .footer { position: absolute; bottom: 28px; color: rgba(243, 229, 200, .45); font-size: 9px; letter-spacing: .28em; text-transform: uppercase; }
    @media (max-width: 640px) { .nav { padding-top: 23px; } .nav-note { display: none; } h1 { font-size: clamp(43px, 14vw, 76px); } .footer { bottom: 22px; } }
  </style>
</head>
<body>
  <main class="landing">
    <nav class="nav" aria-label="Main navigation">
      <div class="mark">LOKI</div>
      <div class="nav-note">A personal archive</div>
    </nav>
    <section class="content">
      <div class="eyebrow">A story written across time</div>
      <h1>Welcome to the world of <span>Loki the Great.</span></h1>
      <p class="intro">God of Mischief. King of Asgard. Step inside and meet the legend behind the many faces.</p>
      <a class="enter" href="index.html">Hello sir, can I know you more?</a>
    </section>
    <div class="footer">Turn the page · Enter the legend</div>
  </main>
</body>
</html>
